[project]
name = "twpa-twpc-simulator"
version = "0.1.0"
description = "Simulation and analysis toolkit for traveling-wave Josephson parametric amplifiers and converters (TWPA/TWPC)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stylianos Tzelepis" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
numba = ["numba>=0.59"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autobuild>=2024.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pyright>=1.1",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true