[project]
name = "TWPA-TWPC-Simulator"
version = "0.1.0"
requires-python = ">=3.10"
description = ""
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
numba = ["numba>=0.59"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autobuild>=2024.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true